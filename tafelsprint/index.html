<!doctype html>
<html lang="nl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tafelsprint</title>
<meta name="description" content="Tafels oefenen in sprints van 1 minuut.">
<meta name="theme-color" content="#2a74c9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tafels">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: start = modus + startknop + record/geschiedenis + tafelkaart; sprint (iPad landscape) = toren | som | klok & teller */
:root{
  --bg:#e9edf0; --panel:#ffffff; --ink:#1d2730; --muted:#5b6873; --line:#c9d2d9; --chalk:#f6f8f9;
  --acc:#d9622f; --good:#2e8a4a; --bad:#c2402f;
  --l0:#e3e8ec; --l1:#e8a598; --l2:#f1e7b8; --l3:#6fb77f; --gold:#c9940a;
  --display:"Bungee","Arial Black",Impact,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14191e; --panel:#1e252c; --ink:#eef2f5; --muted:#9aa7b2; --line:#33404b; --chalk:#252e36;
  --acc:#f07a45; --good:#55c174; --bad:#ec6b58;
  --l0:#2a333c; --l1:#8e3c30; --l2:#c9c08f; --l3:#2f7a45; --gold:#f7d154; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14191e; --panel:#1e252c; --ink:#eef2f5; --muted:#9aa7b2; --line:#33404b; --chalk:#252e36;
  --acc:#f07a45; --good:#55c174; --bad:#ec6b58;
  --l0:#2a333c; --l1:#8e3c30; --l2:#c9c08f; --l3:#2f7a45; --gold:#f7d154; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-block:16px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:clamp(28px,7vw,44px);line-height:1.05}
h2{font-size:20px}
p{margin:0}
.muted{color:var(--muted)}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
kbd{font:700 12px var(--body);border:1.5px solid currentColor;border-bottom-width:3px;border-radius:4px;padding:0 5px;opacity:.75;margin-left:4px;vertical-align:middle}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:8px 14px;font-weight:700}
.btn.main{background:var(--acc);border-color:var(--acc);color:#fff;font-size:20px;padding:12px 26px}
.btn.main:hover{filter:brightness(1.07)}

/* home */
.top{display:grid;gap:18px}
@media (min-width:860px){.top{grid-template-columns:1.2fr 1fr}}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:2px solid var(--line);background:var(--chalk);color:var(--ink);border-radius:6px;padding:8px 14px;font-weight:700}
.seg button[aria-pressed="true"]{border-color:var(--acc);background:var(--acc);color:#fff}
.seg button:disabled{opacity:.5;cursor:not-allowed}
.startrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.rec{display:flex;align-items:baseline;gap:10px}
.rec b{font:400 44px var(--display);color:var(--acc);font-variant-numeric:tabular-nums;line-height:1}
.hist{display:flex;align-items:flex-end;gap:4px;height:90px;border-bottom:2px solid var(--line);padding-top:16px}
.hist .hb{flex:1;max-width:28px;background:color-mix(in srgb,var(--acc) 55%,var(--chalk));border-radius:3px 3px 0 0;position:relative;min-height:3px}
.hist .hb.last{background:var(--acc)}
.hist .hb span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.cloud{font-size:13px;color:var(--muted)}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted)}

/* tafelkaart */
.mapwrap{overflow-x:auto}
.map{display:grid;gap:3px;min-width:320px;font-variant-numeric:tabular-nums}
.map .h{font-size:13px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center}
.map .c{aspect-ratio:1.6;border-radius:4px;background:var(--l0);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--ink)}
.map .c.l1{background:var(--l1)}.map .c.l2{background:var(--l2);color:#1d2730}.map .c.l3{background:var(--l3)}
.map .c.l4{background:var(--l3);box-shadow:inset 0 0 0 3px var(--gold)}
.map .c.l5{background:linear-gradient(135deg,#ff6b6b,#ffb547,#ffe66d,#6bdb8f,#5ab9ff,#a98bfa);color:#1d2730}
.legend i.gold{background:var(--l3);box-shadow:inset 0 0 0 3px var(--gold)}
.legend i.rainbow{background:linear-gradient(135deg,#ff6b6b,#ffb547,#ffe66d,#6bdb8f,#5ab9ff,#a98bfa)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.maphead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

/* sprint */
.sprint{display:grid;gap:18px}
@media (min-width:860px){.sprint{grid-template-columns:110px 1fr}}
.tower{position:relative;height:460px;display:flex;flex-direction:column-reverse;gap:1px;border-bottom:4px solid var(--line);padding:0 10px}
.tower .b{flex:1;background:var(--chalk);border-radius:2px;min-height:1px}
.tower .b.on{background:var(--acc);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.tower .b.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:translateY(-30px);opacity:0}70%{transform:translateY(2px);opacity:1}100%{transform:none}}
.recline{position:absolute;left:0;right:0;border-top:3px dashed var(--ink);z-index:2}
.recline span{position:absolute;right:0;bottom:2px;font-size:11px;font-weight:700;background:var(--panel);padding:0 3px;border-radius:3px}
.recline.beaten{border-color:var(--good)}.recline.beaten span{color:var(--good)}
.tcol{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.tcol .cnt{font:400 26px var(--display);color:var(--acc);text-align:center;font-variant-numeric:tabular-nums}
@media (max-width:859px){
  .tower{height:20px;flex-direction:row;padding:0;border:0}
  .recline{top:-4px;bottom:-4px;left:auto;right:auto;border-top:0;border-left:3px dashed var(--ink)}
  .recline span{display:none}
}
.main{display:flex;flex-direction:column;gap:22px;min-width:0}
.clock{display:flex;align-items:center;gap:14px}
.clock .bar{flex:1;height:14px;background:var(--chalk);border:2px solid var(--line);border-radius:8px;overflow:hidden}
.clock .fill{height:100%;background:var(--acc);transition:width 1s linear;width:100%}
.clock .fill.low{background:var(--bad)}
.clock .sec{font:400 26px var(--display);font-variant-numeric:tabular-nums;min-width:3ch;text-align:right}
.sum{display:flex;align-items:center;justify-content:center;gap:.3em;font-size:clamp(56px,11vw,104px);font-weight:700;font-variant-numeric:tabular-nums;padding:20px 0;flex-wrap:wrap}
.sum input{width:3ch;font:700 1em var(--body);text-align:center;border:3px solid var(--line);border-radius:10px;background:var(--chalk);color:var(--ink);padding:0 .1em;font-variant-numeric:tabular-nums}
.sum.wrong input{border-color:var(--bad);color:var(--bad)}
.sum.right input{border-color:var(--good)}
.fbline{min-height:42px;text-align:center;font-size:24px;font-weight:700}
.fbline.bad{color:var(--bad)}
.hint{text-align:center;font-size:14px;color:var(--muted)}
.stats{display:flex;justify-content:center;gap:28px;flex-wrap:wrap;font-weight:700;color:var(--muted)}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}

/* result */
.result{text-align:center;align-items:center}
.result .big{font:400 72px var(--display);color:var(--acc);line-height:1}
.miss{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.miss span{background:var(--chalk);border:2px solid var(--bad);border-radius:6px;padding:4px 10px;font-weight:700;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.io-back{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.io{background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:10px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:16px;box-sizing:border-box}
.io section{display:flex;flex-direction:column;gap:8px}
.io h3{font-size:16px}
.io textarea{width:100%;box-sizing:border-box;font:13px ui-monospace,Menlo,monospace;border:2px solid var(--line);border-radius:6px;background:var(--chalk);color:var(--ink);padding:8px;resize:vertical;word-break:break-all}
.io-row{display:flex;gap:8px;flex-wrap:wrap}.io-row.end{justify-content:flex-end}
.io-msg{font-weight:700;min-height:1.2em;margin:0}.io-msg.ok{color:var(--good)}.io-msg.err{color:var(--bad)}
.io-open{margin-top:4px}
</style>

<div class="wrap" id="app"></div>

<script>
(function(){
const SPRINT=60;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const load=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}};
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let stats=load('ts-stats',{}),recs=load('ts-recs',{}),hist=load('ts-hist',[]),opts=load('ts-opts',{mode:'keer',bonus:false,map:'keer',max:10});
if(!(opts.max>=2&&opts.max<=20))opts.max=10;
if(opts.bonus){opts.bonus=false;opts.max=12}
if(opts.map==='bonus')opts.map='keer';
let preview=false;

/* ---------- facts ---------- */
// keer: key "k a b" with a<=b ; delen: key "d p b" meaning p : b = a
const kKey=(a,b)=>`k${Math.min(a,b)}x${Math.max(a,b)}`;
const dKey=(a,b)=>`d${a*b}:${b}`;
function facts(op,bonus){
  const out=[];
  if(!bonus){const M=bonus===false&&arguments.length>2?arguments[2]:opts.max,seen=new Set();
    for(let t=1;t<=M;t++)for(let q=1;q<=10;q++){const f=op==='keer'?{op,a:Math.min(t,q),b:Math.max(t,q)}:{op,a:q,b:t};const k=keyOf(f);if(!seen.has(k)){seen.add(k);out.push(f)}}}
  else{for(const t of [11,12])for(let b=1;b<=12;b++){if(op==='keer'&&t===12&&b===11)continue;out.push(op==='keer'?{op,a:Math.min(t,b),b:Math.max(t,b)}:{op,a:b,b:t})}}
  return out;
}
const keyOf=f=>f.op==='keer'?kKey(f.a,f.b):dKey(f.a,f.b);
const med=a=>{if(!a||!a.length)return Infinity;const s=[...a].sort((x,y)=>x-y);return s[Math.floor(s.length/2)]};
/* Niveaus blijven staan: een fout zet alleen de reeks naar het volgende niveau op 0.
   e = behaald niveau (0 = nog niets, 3 groen, 4 goud, 5 regenboog); s = reeks sinds laatste fout/promotie */
/* benodigde snelheid glijdt mee met het niveau: t/m 2 = 8 / 6 / 4 s, t/m 10 (en bonus) = 5 / 3,5 / 2,5 s */
function speeds(){const M=Math.min(opts.max,10),f=(M-2)/8;return[Math.round(8000-3000*f),Math.round(6000-2500*f),Math.round(4000-1500*f)]}
function nextStep(e){const sp=speeds();return{0:{need:3,ms:sp[0],to:3},3:{need:7,ms:sp[1],to:4},4:{need:15,ms:sp[2],to:5}}[e]}
const secs=ms=>(ms/1000).toFixed(1).replace('.0','').replace('.',',');
function norm(s){
  if(s.e===undefined){
    s.lw=s.n>0&&s.s===0;
    s.e=(s.s>=3&&med(s.t)<=5000)?3:0;
    if(s.e){s.s=0;s.t=[];s.lw=false}
  }
  return s;
}
function level(key){
  const s=stats[key];
  if(!s||!s.n)return 0;
  norm(s);
  if(s.e>=3)return s.e;
  return s.lw?1:2;
}
const WEIGHT=[2.5,7,3.5,0.7,0.4,0.25];
const greenKeer=()=>facts('keer',false,10).filter(f=>level(keyOf(f))>=3).length;
const BONUS_NEED=50; // van de 55 keersommen
const bonusOpen=()=>preview||greenKeer()>=BONUS_NEED;

/* ---------- state ---------- */
const app=document.getElementById('app');
let S=null,clock=null;
function saveLocal(){store('ts-stats',stats);store('ts-recs',recs);store('ts-hist',hist)}
/* ---- voortgang in het Claude-account (privé per gebruiker) ---- */
let cloud=null,cloudState='loading',saving=false,pending=false;
const getState=()=>({stats,recs,hist});
function mergeIn(d){
  for(const k in (d.recs||{}))recs[k]=Math.max(recs[k]||0,d.recs[k]||0);
  for(const k in (d.stats||{})){const a=stats[k],b=d.stats[k];if(!a||(b&&(b.n||0)>(a.n||0)))stats[k]=b}
  const seen=new Set(hist.map(h=>h.d+'|'+h.k));
  for(const h of (d.hist||[]))if(!seen.has(h.d+'|'+h.k))hist.push(h);
  hist.sort((a,b)=>a.d-b.d);hist=hist.slice(-60);
}
async function pushCloud(){
  if(!cloud)return;
  if(saving){pending=true;return}
  saving=true;
  try{await cloud.set(getState())}catch(e){if(e&&(e.code==='invalid_argument'||e.code==='revoked'||e.code==='not_granted')){cloud=null;cloudState='local'}}
  saving=false;
  if(pending){pending=false;pushCloud()}
}
async function initCloud(){
  try{
    if(!window.claude||!window.claude.use)throw 0;
    const db=await window.claude.use('db'),user=await window.claude.use('user');
    if(!db||!user)throw 0;
    const id=await user.id();if(!id)throw 0;
    const ref=db.doc('data/users/'+id+'/progress');
    const snap=await Promise.race([ref.get(),new Promise((_,rej)=>setTimeout(()=>rej(0),10000))]);
    const remote=snap.exists?snap.data():{};
    mergeIn(remote);saveLocal();
    cloud=ref;cloudState='cloud';
    if(JSON.stringify(getState())!==JSON.stringify({stats:remote.stats||{},recs:remote.recs||{},hist:remote.hist||[]}))await pushCloud();
  }catch(e){cloudState='local'}
  if(!S&&document.getElementById('go'))home();
}
const cloudNote=()=>cloudState==='cloud'?'<span class="cloud">☁️ Voortgang wordt bewaard in je Claude-account</span>':cloudState==='local'?'<span class="cloud">⚠️ Voortgang staat alleen op dit apparaat. Log in bij Claude om hem veilig te bewaren.</span>':'';
const recKey=()=>opts.mode+(opts.max===10?'':'-t'+opts.max);
const lvlLabel=()=>'tafels 1 t/m '+opts.max;
const MODES={keer:'Keersommen',delen:'Deelsommen',mix:'Gemengd'};

function stop(){if(clock){clearInterval(clock);clock=null}}

/* ---------- home ---------- */
function home(focusSel){
  stop();S=null;
  const rec=recs[recKey()]||0;
  const h=hist.filter(x=>x.k===recKey()).slice(-15);
  const hmax=Math.max(10,...h.map(x=>x.n));
  const g=greenKeer();
  app.innerHTML=`
  <header style="display:flex;flex-direction:column;gap:6px">
    <h1>Tafelsprint</h1>
    <p class="muted">Eén minuut. Zoveel mogelijk sommen goed. Elk goed antwoord is een blok op je toren. Kom jij boven je record?</p>
    ${cloudNote()}
  </header>
  <section class="top">
    <div class="panel">
      <span class="label">Wat ga je oefenen?</span>
      <div class="seg" id="modes">${Object.entries(MODES).map(([k,v])=>`<button data-m="${k}" aria-pressed="${opts.mode===k}">${v}</button>`).join('')}</div>
      <span class="label">Tafels 1 t/m …</span>
      <div class="seg" id="lvls">${Array.from({length:19},(_,i)=>i+2).map(n=>`<button data-n="${n}" aria-pressed="${opts.max===n}">${n}</button>`).join('')}</div>
      <div class="startrow"><button class="btn main" id="go">Start sprint <kbd>Enter</kbd></button><span class="muted">1 minuut</span></div>
    </div>
    <div class="panel">
      <span class="label">Record · ${MODES[opts.mode]} · ${lvlLabel()}</span>
      <div class="rec"><b>${rec}</b><span class="muted">goed in 1 minuut</span></div>
      ${h.length?`<div class="hist" aria-label="Laatste sprints">${h.map((x,i)=>`<div class="hb${i===h.length-1?' last':''}" style="height:${Math.max(3,x.n/hmax*100)}%"><span>${x.n}</span></div>`).join('')}</div>
        <span class="muted" style="font-size:13px">Je laatste ${h.length} sprints</span>`:'<p class="muted">Nog geen sprints gedaan. Druk op Start!</p>'}
    </div>
  </section>
  <section class="panel">
    <div class="maphead"><h2>Tafelkaart</h2>
      <div class="seg" id="maps"><button data-v="keer" aria-pressed="${opts.map==='keer'}">Keer</button><button data-v="delen" aria-pressed="${opts.map==='delen'}">Delen</button></div></div>
    <div class="mapwrap">${mapHTML()}</div>
    <div class="legend"><span><i style="background:var(--l0)"></i>Nog niet gedaan</span><span><i style="background:var(--l1)"></i>Laatst fout</span><span><i style="background:var(--l2)"></i>Bijna</span><span><i style="background:var(--l3)"></i>Zit erin (3× goed, binnen ${secs(speeds()[0])} s)</span><span><i class="gold"></i>Goud (nog 7× goed, binnen ${secs(speeds()[1])} s)</span><span><i class="rainbow"></i>Regenboog (nog 15× goed, binnen ${secs(speeds()[2])} s)</span></div>
    <p class="muted" style="font-size:14px;margin:0">Een kleur die je hebt, blijf je houden. Een fout zet alleen de teller naar de volgende kleur weer op 0. De tijden horen bij je niveau (${lvlLabel()}).</p>
  </section>
  <p class="io-open"><button class="btn" id="io-open">Voortgang bewaren of herstellen</button></p>`;
  app.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{opts.mode=b.dataset.m;store('ts-opts',opts);home(`#modes [data-m="${b.dataset.m}"]`)});
  app.querySelectorAll('#lvls [data-n]').forEach(b=>b.onclick=()=>{opts.bonus=false;opts.max=+b.dataset.n;store('ts-opts',opts);home(`#lvls [data-n="${b.dataset.n}"]`)});
  app.querySelectorAll('#maps button').forEach(b=>b.onclick=()=>{opts.map=b.dataset.v;store('ts-opts',opts);home(`#maps [data-v="${b.dataset.v}"]`)});
  document.getElementById('go').onclick=startSprint;
  const f=(focusSel&&app.querySelector(focusSel))||document.getElementById('go');
  f.focus({preventScroll:true});
}
function mapHTML(){
  const v=opts.map==='delen'?'delen':'keer';
  if(v==='bonus'){
    // rows 11,12 ; cols 1..12, keer and delen side by side? keep keer
    let h=`<div class="map" style="grid-template-columns:44px repeat(12,1fr)"><span class="h"></span>${Array.from({length:12},(_,i)=>`<span class="h">${i+1}</span>`).join('')}`;
    for(const t of [11,12]){h+=`<span class="h">${t}×</span>`;for(let b=1;b<=12;b++)h+=`<span class="c l${level(kKey(t,b))}" title="${t} × ${b}">${t*b}</span>`}
    for(const t of [11,12]){h+=`<span class="h">:${t}</span>`;for(let a=1;a<=12;a++)h+=`<span class="c l${level(dKey(a,t))}" title="${a*t} : ${t}">${a*t}</span>`}
    return h+'</div>';
  }
  const M=opts.max;
  let h=`<div class="map" style="grid-template-columns:44px repeat(10,1fr)"><span class="h">${v==='keer'?'×':':'}</span>${Array.from({length:10},(_,i)=>`<span class="h">${i+1}</span>`).join('')}`;
  for(let r=1;r<=M;r++){
    h+=`<span class="h">${v==='keer'?r:': '+r}</span>`;
    for(let c=1;c<=10;c++){
      const k=v==='keer'?kKey(r,c):dKey(c,r);
      h+=`<span class="c l${level(k)}" title="${v==='keer'?`${r} × ${c}`:`${c*r} : ${r}`}">${v==='keer'?r*c:c*r}</span>`;
    }
  }
  return h+'</div>';
}

/* ---------- sprint ---------- */
function pool(){
  const ops=opts.mode==='mix'?['keer','delen']:[opts.mode];
  return ops.flatMap(op=>facts(op,opts.bonus));
}
function nextFact(){
  const due=S.queue.findIndex(q=>q.due<=S.count);
  if(due>=0){const f=S.queue.splice(due,1)[0].f;if(keyOf(f)!==S.lastKey)return f}
  const P=S.pool.filter(f=>keyOf(f)!==S.lastKey&&keyOf(f)!==S.prevKey);
  let tot=0;const w=P.map(f=>{let x=WEIGHT[level(keyOf(f))];if(!opts.bonus&&(f.a===1||f.b===1))x*=.35;tot+=x;return x});
  let r=Math.random()*tot;for(let i=0;i<P.length;i++){r-=w[i];if(r<=0)return P[i]}
  return P[P.length-1];
}
function present(f){
  if(f.op==='keer'){const sw=Math.random()<.5;return{txt:sw?`${f.b} × ${f.a}`:`${f.a} × ${f.b}`,ans:f.a*f.b}}
  return{txt:`${f.a*f.b} : ${f.b}`,ans:f.a};
}
function startSprint(){
  stop();
  S={pool:pool(),queue:[],count:0,good:0,wrong:[],left:SPRINT,rec:recs[recKey()]||0,lastKey:null,prevKey:null,busy:false};
  S.cap=Math.max(30,Math.ceil((S.rec+8)/10)*10);
  app.innerHTML=`
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
    <button class="btn" id="stopb">← Stoppen <kbd>Esc</kbd></button>
    <span class="muted"><b>${MODES[opts.mode]}</b> · ${lvlLabel()} · record ${S.rec}</span></div>
  <section class="panel sprint">
    <div class="tcol"><div class="tower" id="tower"></div><div class="cnt" id="cnt">0</div></div>
    <div class="main">
      <div class="clock"><div class="bar"><div class="fill" id="fill"></div></div><span class="sec" id="sec">${SPRINT}</span></div>
      <div class="sum" id="sum"><span id="q"></span><span>=</span><input id="ans" inputmode="numeric" autocomplete="off" aria-label="Antwoord"></div>
      <div class="fbline" id="fb"></div>
      <div class="stats"><span>Goed: <b id="sg">0</b></span><span>Fout: <b id="sf">0</b></span></div>
      <p class="hint">Typ het antwoord. Het gaat vanzelf door als je genoeg cijfers hebt getypt (of druk op <kbd>Enter</kbd>).</p>
    </div>
  </section>`;
  document.getElementById('stopb').onclick=home;
  drawTower(false);
  const inp=document.getElementById('ans');
  inp.addEventListener('input',()=>{
    const v=inp.value.replace(/\D/g,'').slice(0,3);if(v!==inp.value)inp.value=v;
    if(!S.busy&&v.length>=String(S.cur.ans).length)submit();
  });
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(inp.value)submit()}else if(e.key==='Escape'){home()}});
  ask();
  requestAnimationFrame(()=>{document.getElementById('fill').style.width='0%'});
  document.getElementById('fill').style.transition=`width ${SPRINT}s linear`;
  S.t0=Date.now();
  clock=setInterval(()=>{
    S.left=Math.max(0,SPRINT-Math.floor((Date.now()-S.t0)/1000));
    const sec=document.getElementById('sec');if(sec)sec.textContent=S.left;
    if(S.left<=10){const f=document.getElementById('fill');if(f)f.classList.add('low')}
    if(S.left<=0)end();
  },200);
}
function ask(){
  const f=nextFact();S.prevKey=S.lastKey;S.lastKey=keyOf(f);
  S.f=f;S.cur=present(f);S.qt=Date.now();S.busy=false;
  document.getElementById('q').textContent=S.cur.txt;
  const sum=document.getElementById('sum');sum.className='sum';
  const inp=document.getElementById('ans');inp.value='';inp.readOnly=false;if(document.activeElement!==inp)inp.focus({preventScroll:true});
  document.getElementById('fb').textContent='';document.getElementById('fb').className='fbline';
}
function record(key,ok,ms){
  const s=norm(stats[key]||{n:0,s:0,w:0,t:[],e:0,lw:false});
  s.n++;
  if(ok){
    s.lw=false;s.s++;s.t=[...(s.t||[]),ms].slice(-15);
    const nx=nextStep(s.e);
    if(nx&&s.s>=nx.need&&med(s.t.slice(-nx.need))<=nx.ms){s.e=nx.to;s.s=0;s.t=[]}
  }else{s.s=0;s.w++;s.t=[];s.lw=true}
  stats[key]=s;
}
function submit(){
  if(S.busy||!clock)return;
  const inp=document.getElementById('ans'),v=Number(inp.value),ms=Date.now()-S.qt;
  const ok=v===S.cur.ans;
  S.count++;
  record(S.lastKey,ok,ms);
  if(ok){
    S.good++;
    document.getElementById('sum').className='sum right';
    document.getElementById('sg').textContent=S.good;
    document.getElementById('cnt').textContent=S.good;
    if(S.good>=S.cap){S.cap+=10;drawTower(false)}else drawTower(true);
    ask();
  }else{
    S.busy=true;inp.readOnly=true;
    S.wrong.push(`${S.cur.txt} = ${S.cur.ans}`);
    S.queue.push({f:S.f,due:S.count+3});
    document.getElementById('sf').textContent=S.wrong.length;
    document.getElementById('sum').className='sum wrong';
    const fb=document.getElementById('fb');fb.className='fbline bad';fb.textContent=`${S.cur.txt} = ${S.cur.ans}`;
    setTimeout(()=>{if(S&&clock)ask()},1600);
  }
}
function drawTower(pop){
  const t=document.getElementById('tower');if(!t)return;
  let h='';for(let i=0;i<S.cap;i++)h+=`<span class="b${i<S.good?' on':''}${pop&&i===S.good-1?' pop':''}"></span>`;
  if(S.rec>0&&S.rec<=S.cap){
    const pct=S.rec/S.cap*100;
    h+=`<div class="recline${S.good>S.rec?' beaten':''}" style="bottom:${pct}%;${matchMedia('(max-width:859px)').matches?`left:${pct}%;bottom:auto;`:''}"><span>${S.good>S.rec?'record!':'record '+S.rec}</span></div>`;
  }
  t.innerHTML=h;
}
function end(){
  stop();
  const key=recKey(),old=recs[key]||0,isRec=S.good>old&&S.good>0;
  if(isRec)recs[key]=S.good;
  hist.push({k:key,n:S.good,f:S.wrong.length,d:Date.now()});hist=hist.slice(-60);
  saveLocal();pushCloud();
  const msg=isRec?(old?`Nieuw record! ${S.good - old} meer dan je vorige record.`:'Je eerste record staat!'):S.good>=old-2?'Bijna je record. Nog eentje?':'Goed geoefend. Nog een sprint?';
  const misses=[...new Set(S.wrong)];
  app.innerHTML=`
  <section class="panel result">
    <span class="label">${MODES[opts.mode]} · ${lvlLabel()}</span>
    <span class="big">${S.good}</span>
    <h2>${msg}</h2>
    <p class="muted">${S.good} goed, ${S.wrong.length} fout in 1 minuut · record: ${recs[key]||0}</p>
    ${misses.length?`<span class="label">Deze moet je nog even oefenen</span><div class="miss">${misses.map(m=>`<span>${m}</span>`).join('')}</div>`:'<p><b>Geen enkele fout!</b></p>'}
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="btn" id="home">Naar start</button><button class="btn main" id="again">Nog een sprint <kbd>Enter</kbd></button></div>
  </section>`;
  S=null;
  document.getElementById('home').onclick=home;
  const a=document.getElementById('again');a.onclick=startSprint;
  setTimeout(()=>a.focus({preventScroll:true}),400);
}

/* ---------- keyboard ---------- */
let typed='';
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(S){ // tijdens de sprint: toetsen altijd naar het antwoordvak
    const inp=document.getElementById('ans');
    if(inp&&e.target!==inp&&e.key!=='Tab'){if(e.key==='Escape'){home();return}inp.focus({preventScroll:true})}
    return;
  }
  if(e.key==='Escape'&&document.getElementById('again')){e.preventDefault();home();return}
  if(e.key==='Enter'&&document.getElementById('go')&&e.target.tagName!=='BUTTON'){e.preventDefault();startSprint();return}
  if(e.key.length===1&&document.getElementById('go')){
    typed=(typed+e.key.toLowerCase()).slice(-6);
    if(typed==='ouders'&&!preview){preview=true;home()}
  }
});
/* ---- voortgang bewaren / herstellen ---- */
const IO_APP='TS',IO_NAME='Tafelsprint',IO_NAMES={BK:'Breukenklimmer',TS:'Tafelsprint'};
/* Code-formaat v2: deflate + base32 (Crockford). Hoofdletters/kleine letters maken niet uit,
   dus een code overleeft autocorrectie en hoofdletter-gedoe. v1 (base64) wordt nog geaccepteerd. */
const B32='0123456789ABCDEFGHJKMNPQRSTVWXYZ';
function b32enc(u8){let out='',buf=0,bits=0;for(const b of u8){buf=(buf<<8)|b;bits+=8;while(bits>=5){out+=B32[(buf>>>(bits-5))&31];bits-=5}buf&=(1<<bits)-1}if(bits)out+=B32[(buf<<(5-bits))&31];return out}
function b32dec(s){const out=[];let buf=0,bits=0;for(const ch of s.toUpperCase().replace(/[IL]/g,'1').replace(/O/g,'0')){const v=B32.indexOf(ch);if(v<0)throw 0;buf=(buf<<5)|v;bits+=5;if(bits>=8){out.push((buf>>>(bits-8))&255);bits-=8}buf&=(1<<bits)-1}return new Uint8Array(out)}
async function pipe(u8,Stream){const s=new Blob([u8]).stream().pipeThrough(new Stream('deflate-raw'));return new Uint8Array(await new Response(s).arrayBuffer())}
async function ioEncode(){
  const raw=new TextEncoder().encode(JSON.stringify(Object.assign({app:IO_APP,v:2,t:Date.now()},getState())));
  if(typeof CompressionStream==='function'){try{return IO_APP+'2:Z'+b32enc(await pipe(raw,CompressionStream))}catch(e){}}
  return IO_APP+'2:R'+b32enc(raw);
}
async function ioDecode(s){
  s=(s||'').replace(/\s/g,'');
  const m=s.match(/^([A-Za-z]{2})([12]):(.+)$/);
  if(!m)throw new Error('Dit is geen geldige voortgangscode. Kopieer de hele code, inclusief het begin.');
  const app=m[1].toUpperCase();
  if(app!==IO_APP)throw new Error(`Deze code hoort bij ${IO_NAMES[app]||'een ander spel'}, niet bij ${IO_NAME}.`);
  let d;
  try{
    if(m[2]==='1'){d=JSON.parse(decodeURIComponent(escape(atob(m[3]))))}
    else{
      const kind=m[3][0].toUpperCase(),bytes=b32dec(m[3].slice(1));
      const raw=kind==='Z'?await pipe(bytes,DecompressionStream):bytes;
      d=JSON.parse(new TextDecoder().decode(raw));
    }
  }catch(e){throw new Error(m[2]==='1'?'Deze oude code is beschadigd (misschien zijn hoofdletters veranderd). Maak een nieuwe code in het spel.':'De code is niet compleet of beschadigd. Kopieer hem opnieuw.')}
  if(!d||d.app!==IO_APP)throw new Error('De code is niet compleet of beschadigd.');
  return d;
}
let ioOpener=null,ioChanged=false;
function ioShow(){
  let back=document.getElementById('io');
  if(!back){
    back=document.createElement('div');back.className='io-back';back.id='io';
    back.innerHTML=`<div class="io" role="dialog" aria-modal="true" aria-labelledby="io-t">
      <h2 id="io-t">Voortgang bewaren of herstellen</h2>
      <section><h3>Bewaren</h3><p class="muted">Kopieer deze code en bewaar hem, bijvoorbeeld in Notities of in een mail aan jezelf.</p>
        <textarea id="io-out" readonly rows="3" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" aria-label="Voortgangscode"></textarea>
        <div class="io-row"><button class="btn main" id="io-copy">Kopieer code</button><button class="btn" id="io-file">Bewaar als bestand</button></div>
        <p class="io-msg" id="io-m1" role="status"></p></section>
      <section><h3>Herstellen</h3><p class="muted">Plak een bewaarde code of kies een bewaard bestand. De voortgang wordt samengevoegd met wat er al staat, dus je raakt niets kwijt.</p>
        <textarea id="io-in" rows="3" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" placeholder="Plak hier je code" aria-label="Code om te herstellen"></textarea>
        <div class="io-row"><button class="btn main" id="io-load">Herstel voortgang</button><button class="btn" id="io-pickb">Kies bestand</button><input type="file" id="io-pick" accept=".txt,text/plain" hidden></div>
        <p class="io-msg" id="io-m2" role="status"></p></section>
      <div class="io-row end"><button class="btn" id="io-close">Sluiten <kbd>Esc</kbd></button></div></div>`;
    document.body.appendChild(back);
    const $=id=>document.getElementById(id);
    const msg=(id,t,ok)=>{const m=$(id);m.textContent=t;m.className='io-msg '+(ok?'ok':'err')};
    $('io-copy').onclick=async()=>{const t=$('io-out');try{await navigator.clipboard.writeText(t.value);msg('io-m1','Gekopieerd! Plak hem ergens waar je hem terugvindt.',true)}catch(e){t.focus();t.select();msg('io-m1','Kopi\u00ebren lukte niet automatisch. De code is geselecteerd: kopieer hem zelf.',false)}};
    $('io-file').onclick=()=>{try{const d=new Date(),ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('io-out').value],{type:'text/plain'}));a.download=`${IO_NAME}-voortgang-${ds}.txt`;document.body.appendChild(a);a.click();a.remove();
      msg('io-m1','Bestand bewaard (kijk in Downloads of de Bestanden-app).',true)}catch(e){msg('io-m1','Bewaren als bestand lukte niet. Gebruik Kopieer code.',false)}};
    const doImport=async txt=>{try{const d=await ioDecode(txt);mergeIn(d);saveLocal();pushCloud();ioChanged=true;$('io-out').value=await ioEncode();msg('io-m2','Hersteld! Je voortgang is bijgewerkt.',true)}catch(e){msg('io-m2',e.message||'Herstellen lukte niet.',false)}};
    $('io-load').onclick=()=>{if(!$('io-in').value.trim())return msg('io-m2','Plak eerst een code.',false);doImport($('io-in').value)};
    $('io-pickb').onclick=()=>$('io-pick').click();
    $('io-pick').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('io-in').value=String(r.result).trim();doImport(r.result)};r.readAsText(f);e.target.value=''};
    $('io-close').onclick=ioHide;
    back.addEventListener('click',e=>{if(e.target===back)ioHide()});
    back.addEventListener('keydown',e=>{
      e.stopPropagation();
      if(e.key==='Escape'){e.preventDefault();ioHide();return}
      if(e.key==='Tab'){const f=[...back.querySelectorAll('button,textarea')].filter(x=>!x.disabled);const first=f[0],last=f[f.length-1];
        if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}
    });
  }
  ioOpener=document.activeElement;ioChanged=false;
  const out=document.getElementById('io-out');out.value='';ioEncode().then(v=>{out.value=v});
  document.getElementById('io-in').value='';
  document.getElementById('io-m1').textContent='';document.getElementById('io-m2').textContent='';
  back.hidden=false;
  document.getElementById('io-copy').focus({preventScroll:true});
}
function ioHide(){
  const back=document.getElementById('io');if(!back)return;back.hidden=true;
  if(ioChanged&&!S){home();const b=document.getElementById('io-open');if(b)b.focus({preventScroll:true})}
  else if(ioOpener&&document.contains(ioOpener))ioOpener.focus({preventScroll:true});
}
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('#io-open'))ioShow()});
home();
})();
</script>

</body></html>
