<!doctype html>
<html lang="nl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Breukenklimmer</title>
<meta name="description" content="Breuken oefenen in vier klimwerelden.">
<meta name="theme-color" content="#d9622f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Breuken">

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: startscherm = werelden als gekleurde wanden met routes + mini-toren; speelscherm (iPad landscape) = wereld-toren | som | antwoord */
:root{
  --bg:#e9edf0; --panel:#ffffff; --ink:#1d2730; --muted:#5b6873; --line:#c9d2d9;
  --chalk:#f6f8f9; --good:#2e8a4a; --bad:#c2402f;
  --w1:#d9622f; --w2:#3f8a3a; --w3:#2a74c9; --w4:#c99a12;
  --acc:var(--w1);
  --display:"Bungee","Arial Black",Impact,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14191e; --panel:#1e252c; --ink:#eef2f5; --muted:#9aa7b2; --line:#33404b;
  --chalk:#252e36; --good:#55c174; --bad:#ec6b58;
  --w1:#f07a45; --w2:#62b257; --w3:#4f97ea; --w4:#e6b934; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14191e; --panel:#1e252c; --ink:#eef2f5; --muted:#9aa7b2; --line:#33404b;
  --chalk:#252e36; --good:#55c174; --bad:#ec6b58;
  --w1:#f07a45; --w2:#62b257; --w3:#4f97ea; --w4:#e6b934; color-scheme:dark}
/* Breukenklimmer 2: koeler, dieper palet */
:root[data-game="2"]{
  --bg:#dce3eb; --panel:#f8fafc; --ink:#16202b; --muted:#566476; --line:#bfcad6; --chalk:#ecf0f5;
  --w1:#14809a; --w2:#c0391f; --w3:#4752c4; --w4:#c46a12}
@media (prefers-color-scheme:dark){:root[data-game="2"]:not([data-theme="light"]){
  --bg:#0b1017; --panel:#151c26; --ink:#eef3f8; --muted:#93a1b1; --line:#2c3949; --chalk:#1c2531;
  --w1:#3fb6cf; --w2:#f0624a; --w3:#8089f2; --w4:#f0973f}}
:root[data-game="2"][data-theme="dark"]{
  --bg:#0b1017; --panel:#151c26; --ink:#eef3f8; --muted:#93a1b1; --line:#2c3949; --chalk:#1c2531;
  --w1:#3fb6cf; --w2:#f0624a; --w3:#8089f2; --w4:#f0973f}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-block:16px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:clamp(28px,7vw,44px);line-height:1.05}
h2{font-size:24px}
p{margin:0}
.muted{color:var(--muted)}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

/* fractions */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;margin:0 .1em;font-variant-numeric:tabular-nums}
.fr>span:first-child{border-bottom:.08em solid currentColor;padding:0 .15em}
.fr>span{padding:0 .15em}
.big{font-size:clamp(34px,9vw,52px);font-weight:700;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:.25em;padding:8px 0}

/* home */
.hero{display:flex;flex-direction:column;gap:8px}
.hero .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.score{display:inline-flex;gap:8px;align-items:center;font-weight:700;background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:4px 10px;width:max-content}
.cloud{font-size:13px;color:var(--muted)}
.badge{font:400 13px var(--display);background:var(--ink);color:var(--bg);border-radius:4px;padding:3px 8px;vertical-align:middle}
.worlds{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:700px){.worlds{grid-template-columns:1fr 1fr}}
.world{--c:var(--w1);background:var(--panel);border:2px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.world .top{background:var(--c);color:#fff;padding:14px 16px;position:relative;
  background-image:radial-gradient(circle at 12% 30%,rgba(255,255,255,.22) 0 7px,transparent 8px),radial-gradient(circle at 70% 70%,rgba(0,0,0,.16) 0 9px,transparent 10px),radial-gradient(circle at 88% 25%,rgba(255,255,255,.18) 0 5px,transparent 6px)}
.world .top h2{font-size:21px}
.world .top small{font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:12px;opacity:.9}
.world .prog{display:flex;flex-direction:column;gap:4px;padding:12px 12px 0}
.world .prog span{font-size:13px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between}
.world .levels{display:flex;flex-direction:column;gap:8px;padding:12px}
.lvl{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--chalk);border:2px solid var(--line);border-radius:6px;padding:10px 12px;text-align:left;color:var(--ink)}
.lvl:hover{border-color:var(--c)}
.lvl.boss{border-style:dashed;border-color:var(--c)}
.lvl b{display:block}
.lvl .sub{font-size:14px;color:var(--muted)}
.stars{font-size:18px;letter-spacing:2px;white-space:nowrap;color:var(--c)}
.stars .off{color:var(--line)}
.unlock{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--panel);border:2px dashed var(--line);border-radius:8px;padding:16px 18px}
.unlock.open{border-style:solid;border-color:var(--ink)}
.unlock h2{font-size:20px}

/* world tower / wall */
.meter{display:flex;gap:2px;position:relative;--c:var(--acc)}
.m{flex:1;min-height:3px;position:relative;background:var(--chalk);border:1.5px solid var(--line);border-radius:3px;transition:background .3s}
.m.on{background:var(--c);border-color:color-mix(in srgb,var(--c) 70%,#000)}
.m.dim.on{opacity:.45}
.meter.mini{height:14px}
.mini .m.rs{margin-left:5px}
.vert{flex-direction:column-reverse;height:440px;width:100%;padding:28px 4px 0;border-bottom:4px solid var(--line)}
.vert .m.rs{margin-bottom:7px}
.vert .m.cur:not(.on){border-style:dashed;border-color:var(--c)}
.vert.wall .m{width:48%;border-radius:50% 45% 55% 40%/60% 50% 50% 40%}
.vert.wall .m:nth-child(odd){align-self:flex-start}
.vert.wall .m:nth-child(even){align-self:flex-end}
.vert.obby{justify-content:space-between;gap:0}
.vert.obby .m{flex:0 0 7px;width:56%;border-radius:2px}
.vert.obby .m:nth-child(3n+1){align-self:flex-start}
.vert.obby .m:nth-child(3n+2){align-self:center}
.vert.obby .m:nth-child(3n){align-self:flex-end}
.vert.tower .m{width:100%;border-radius:2px}
.vert.tower .m.on{box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.25)}
.climber{position:absolute;left:50%;bottom:calc(100% + 1px);transform:translateX(-50%);width:16px;height:22px;color:var(--ink);z-index:2;animation:hop .45s ease-out}
.climber.low{bottom:auto;top:calc(100% + 3px)}
.climber svg{display:block;width:100%;height:100%}
@keyframes hop{0%{transform:translate(-50%,10px)}60%{transform:translate(-50%,-7px)}100%{transform:translate(-50%,0)}}
.m.pop{animation:pop .45s ease-out}
@keyframes pop{0%{transform:translateY(-24px) scale(.6);opacity:0}70%{transform:translateY(2px) scale(1.06);opacity:1}100%{transform:none}}
.tcol{display:flex;flex-direction:column;gap:8px;align-items:center;min-width:0}
.tcol .lab2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted);text-align:center;line-height:1.2}
.tcol .cnt{font:400 18px var(--display);color:var(--acc);font-variant-numeric:tabular-nums}

/* play */
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.timer{font:400 22px var(--display);font-variant-numeric:tabular-nums;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:2px 10px}
.timer.low{color:var(--bad);border-color:var(--bad)}
.btn{border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:8px 14px;font-weight:700}
.btn.main{background:var(--acc);border-color:var(--acc);color:#fff;font-size:18px;padding:10px 22px}
.btn.main:hover{filter:brightness(1.07)}
.route{display:flex;gap:6px;align-items:flex-end;justify-content:space-between;background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:12px 14px}
.hold{flex:1;max-width:46px;aspect-ratio:1.2;background:var(--line);border-radius:48% 52% 40% 60%/55% 45% 55% 45%;transition:background .3s,transform .3s}
.hold:nth-child(2n){border-radius:60% 40% 55% 45%/45% 60% 40% 55%}
.hold:nth-child(3n){border-radius:40% 60% 45% 55%/60% 40% 60% 40%}
.hold.ok{background:var(--acc)}
.hold.miss{background:var(--bad);opacity:.55}
.hold.now{transform:scale(1.18);outline:3px dashed var(--acc);outline-offset:2px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:16px}
.card.play{display:grid;gap:20px}
.qside,.aside{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (min-width:860px){
  .card.play{grid-template-columns:96px 1.1fr 1fr;align-items:start;padding:24px}
  .aside{border-left:2px solid var(--line);padding-left:24px;justify-content:center;min-height:100%}
  .tcol{border-right:2px solid var(--line);padding-right:16px;min-height:100%}
  .wrap{gap:14px}
}
@media (max-width:859px){
  .vert{flex-direction:row;height:16px;padding:0;border:0;justify-content:stretch;gap:2px}
  .vert .m,.vert.obby .m{flex:1;width:auto;align-self:stretch!important;border-radius:2px}
  .vert .m.rs{margin-bottom:0;margin-left:5px}
  .vert .climber{display:none}
  .tcol{flex-direction:row;flex-wrap:wrap;width:100%}
  .tcol .meter{flex:1;min-width:200px}
}
kbd{font:700 12px var(--body);border:1.5px solid currentColor;border-bottom-width:3px;border-radius:4px;padding:0 5px;opacity:.75;margin-left:4px;vertical-align:middle}
.choice kbd{display:block;width:max-content;margin:0 auto 4px;font-size:12px}
.keys{font-size:14px;color:var(--muted);text-align:center}
.keys kbd{margin:0 2px}
.tag{font-size:13px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--acc)}
.story{font-size:19px}
.answer{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.fin{display:inline-flex;align-items:center;gap:8px}
.stack{display:flex;flex-direction:column;align-items:center;gap:4px}
.stack .ln{width:84px;height:4px;background:var(--ink);border-radius:2px}
input.n{width:84px;font:700 28px var(--body);text-align:center;padding:6px;border:2px solid var(--line);border-radius:6px;background:var(--chalk);color:var(--ink);font-variant-numeric:tabular-nums}
input.n.whole{width:70px}
.choices{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.choice{min-width:110px;font-size:30px;font-weight:700;padding:10px 18px;border:2px solid var(--line);border-radius:8px;background:var(--chalk);color:var(--ink)}
.choice.small{font-size:20px}
.choice:hover{border-color:var(--acc)}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.fb{border-radius:6px;padding:12px 14px;border:2px solid var(--line);background:var(--chalk);display:flex;flex-direction:column;gap:6px}
.fb.good{border-color:var(--good)}
.fb.bad{border-color:var(--bad)}
.fb h3{font-size:18px}
.fb.good h3{color:var(--good)}
.fb.bad h3{color:var(--bad)}
.steps{font-size:18px;line-height:2.2}

/* block bars */
.blocks{display:flex;flex-direction:column;gap:10px}
.brow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brow .lab{min-width:56px;font-size:24px;font-weight:700}
.cells{display:flex;gap:3px;flex-wrap:wrap}
.cell{width:22px;height:22px;background:var(--chalk);border:2px solid var(--line);border-radius:3px}
.cell.on{background:var(--acc);border-color:color-mix(in srgb,var(--acc) 70%,#000)}

/* result */
.result{text-align:center;align-items:center}
.result .stars{font-size:46px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.io-back{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.io{background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:10px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:16px;box-sizing:border-box}
.io section{display:flex;flex-direction:column;gap:8px}
.io h3{font-size:16px}
.io textarea{width:100%;box-sizing:border-box;font:13px ui-monospace,Menlo,monospace;border:2px solid var(--line);border-radius:6px;background:var(--chalk);color:var(--ink);padding:8px;resize:vertical;word-break:break-all}
.io-row{display:flex;gap:8px;flex-wrap:wrap}.io-row.end{justify-content:flex-end}
.io-msg{font-weight:700;min-height:1.2em;margin:0}.io-msg.ok{color:var(--good)}.io-msg.err{color:var(--bad)}
.io-open{margin-top:4px}
</style>

<div class="wrap" id="app"></div>

<script>
(function(){
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
const lcm=(a,b)=>a/gcd(a,b)*b;
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const red=(n,d)=>{const g=gcd(n,d)||1;return{n:n/g,d:d/g}};
const fr=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
function mix(n,d){
  if(d===1)return `${n}`;
  const w=Math.floor(n/d),r=n%d;
  if(w===0)return fr(r,d); if(r===0)return `${w}`;
  return `${w}&nbsp;${fr(r,d)}`;
}
const DEN={1:[2,3,4,5,6,8,10],2:[2,3,4,5,6,8,9,10,12],3:[3,4,5,6,7,8,9,10,12,15],4:[4,5,6,7,8,9,10,12,15,16,20]};
function proper(diff){const q=pick(DEN[diff]);let p;do{p=R(1,q-1)}while(gcd(p,q)!==1);return{n:p,d:q}}
const QN=8;

/* =================== BREUKENKLIMMER 1 =================== */
const WORLDS=[
 {name:'De Boulderhal',col:'--w1',meter:'wall',intro:'Klim de routes door de breuken te kraken.',
  of:(N,f)=>`Een boulderroute heeft ${N} grepen. Jij haalt ${f} van de route. Hoeveel grepen is dat?`,
  add:(a,b)=>`Je klimt ${a} van de wand, rust even uit en klimt dan nog ${b}. Hoeveel van de wand heb je nu geklommen?`,
  sub:(a,b)=>`Je hangt op ${a} van de wand en zakt ${b} omlaag. Waar hang je nu?`},
 {name:'De Blokkenmijn',col:'--w2',meter:'tower',intro:'Graaf door de mijn. Elke goede som is een blok erts.',
  of:(N,f)=>`Je kist zit vol met ${N} blokken. ${f} daarvan is diamant. Hoeveel diamantblokken heb je?`,
  add:(a,b)=>`Je graaft ${a} van een tunnel en later nog ${b}. Hoeveel van de tunnel is klaar?`,
  sub:(a,b)=>`Je hebt nog ${a} van je fakkels. Je gebruikt er ${b} van. Hoeveel heb je over?`},
 {name:'Het Obby-parcours',col:'--w3',meter:'obby',intro:'Spring van checkpoint naar checkpoint. Niet in de lava vallen!',
  of:(N,f)=>`Een obby heeft ${N} levels. Jij hebt ${f} ervan gehaald. Hoeveel levels is dat?`,
  add:(a,b)=>`Je rent ${a} van het parcours en daarna nog ${b}. Hoeveel van het parcours heb je gehaald?`,
  sub:(a,b)=>`Je bent op ${a} van het parcours en valt ${b} terug. Waar ben je nu?`},
 {name:'De Steentjesfabriek',col:'--w4',meter:'tower',intro:'De moeilijkste wereld. Bouw de hoogste toren.',
  of:(N,f)=>`Je bouwset heeft ${N} steentjes. ${f} ervan is rood. Hoeveel rode steentjes zijn er?`,
  add:(a,b)=>`Jij bouwt ${a} van de toren en je vriend bouwt nog ${b}. Hoeveel van de toren staat er?`,
  sub:(a,b)=>`De bak is voor ${a} gevuld met steentjes. Je pakt er ${b} van de bak uit. Hoe vol is de bak nu?`}
];
const LEVELS=[
 {name:'Vergelijken & vereenvoudigen',sub:'Welke is groter? Kan het korter?'},
 {name:'Optellen & aftrekken',sub:'Gelijknamig maken en rekenen'},
 {name:'Keer & delen',sub:'Deel van, keer en gedeeld door'}
];

function qSimplify(d,kmax){
  const a=proper(d),k=R(2,kmax||d+3);
  return{tag:'Vereenvoudigen',story:'Maak deze breuk zo eenvoudig mogelijk.',big:fr(a.n*k,a.d*k),input:'frac',ans:a,simplest:true,
    bars:[[a.n*k,a.d*k]],
    explain:`Teller en noemer kun je allebei delen door <b>${k}</b>.<br>${fr(a.n*k,a.d*k)} = ${fr(`${a.n*k} : ${k}`,`${a.d*k} : ${k}`)} = ${fr(a.n,a.d)}`};
}
function qCompare(d){
  let a,b;
  if(d>=2&&Math.random()<.2){a=proper(d);const k=R(2,3);b={n:a.n*k,d:a.d*k}}
  else{do{a=proper(d);b=proper(d)}while(a.d===b.d||a.n*b.d===b.n*a.d)}
  const L=lcm(a.d,b.d),x=a.n*L/a.d,y=b.n*L/b.d;
  const ans=x>y?0:x<y?1:2;
  return{tag:'Vergelijken',story:'Welke breuk is het grootst?',big:`${fr(a.n,a.d)} <span class="muted">of</span> ${fr(b.n,b.d)}`,
    input:'choice',choices:[fr(a.n,a.d),fr(b.n,b.d),'Even groot'],ans,bars:[[a.n,a.d],[b.n,b.d]],
    explain:`Maak de noemers gelijk (${L}):<br>${fr(a.n,a.d)} = ${fr(x,L)} en ${fr(b.n,b.d)} = ${fr(y,L)}<br>${x>y?`${x} is meer dan ${y}, dus ${fr(a.n,a.d)} is groter.`:x<y?`${y} is meer dan ${x}, dus ${fr(b.n,b.d)} is groter.`:'Ze zijn precies even groot!'}`};
}
function qEquiv(d){
  const a=proper(d),k=R(2,d+2);
  return{tag:'Gelijkwaardig',story:'Welk getal moet er op het vraagteken?',big:`${fr(a.n,a.d)} = ${fr('?',a.d*k)}`,input:'int',ans:a.n*k,bars:[[a.n,a.d],[0,a.d*k,fr('?',a.d*k)]],
    explain:`De noemer ging van ${a.d} naar ${a.d*k}: dat is <b>× ${k}</b>.<br>Dan moet de teller ook × ${k}: ${a.n} × ${k} = <b>${a.n*k}</b>`};
}
function qAddSub(d,w){
  const op=Math.random()<.55?'+':'−';
  let a,b,wa=0,wb=0;
  if(d===1){
    if(Math.random()<.5){const q=pick([4,5,6,8,10]);a={n:R(1,q-1),d:q};b={n:R(1,q-1),d:q}}
    else{const q=pick([2,3,4,5]),k=pick([2,3]);a=red(R(1,q-1),q);b={n:R(1,q*k-1),d:q*k}}
  }else{
    do{a=proper(d);b=proper(d)}while(a.d===b.d||lcm(a.d,b.d)>(d===2?24:40));
    if(d>=3&&Math.random()<(d===3?.4:.75)){wa=R(1,3);wb=R(0,2)}
  }
  let A={n:wa*a.d+a.n,d:a.d},B={n:wb*b.d+b.n,d:b.d};
  if(op==='−'&&A.n*B.d<B.n*A.d){[A,B]=[B,A];[a,b]=[b,a];[wa,wb]=[wb,wa]}
  if(op==='−'&&A.n*B.d===B.n*A.d)return qAddSub(d,w);

function qMulDiv(d,w){

      explain:`Eerst ${fr(1,a.d)} van ${N}: ${N} : ${a.d} = ${one}<br>Dan ${fr(a.n,a.d)}: ${a.n} × ${one} = <b>${one*a.n}</b>`};

      explain:`Teller × teller en noemer × noemer:<br>${fr(`${a.n} × ${b.n}`,`${a.d} × ${b.d}`)} = ${fr(rn,rd)}${res.d!==rd?` = ${fr(res.n,res.d)}`:''}`};
  }

      explain:`Een breuk delen door ${k}: maak de stukjes ${k} keer zo klein, dus noemer × ${k}.<br>${fr(a.n,a.d)} : ${k} = ${fr(a.n,`${a.d} × ${k}`)} = ${fr(a.n,a.d*k)}${res.d!==a.d*k?` = ${fr(res.n,res.d)}`:''}`};

        :`Delen door een breuk = keer het omgekeerde.<br>${k} : ${fr(a.n,a.d)} = ${k} × ${fr(a.d,a.n)} = ${fr(k*a.d,a.n)} = <b>${ans}</b>`};
  }

  return{tag:'Breuk gedeeld door breuk',story:'Reken uit.',big:`${fr(a.n,a.d)} : ${fr(b.n,b.d)}`,input:'frac',ans:res,bars:null,
    explain:`Delen door een breuk = keer het omgekeerde.<br>${fr(a.n,a.d)} : ${fr(b.n,b.d)} = ${fr(a.n,a.d)} × ${fr(b.d,b.n)} = ${fr(rn,rd)}${(res.d!==rd||res.n>res.d)?` = ${mix(res.n,res.d)}`:''}`};
}

      explain:`In 1 hele passen ${p} stukjes van ${fr(1,p)}.<br>${tot} = ${fr(wh*q+a.n,q)} = ${fr((wh*q+a.n)*k,p)}<br>Dus <b>${ans}</b> keer.`};
  }
  if(t==='time'){
    const a=proper(Math.min(d+1,3)),m=R(2,5),T=a.n*m,ans=a.d*m;
    return{tag:'Verhaalsom',story:`Over ${fr(a.n,a.d)} van ${w.track} doe je ${T} minuten. Je gaat steeds even snel. Hoeveel minuten doe je over ${w.track} helemaal?`,big:'',input:'int',ans,bars:[[a.n,a.d]],
      explain:`${fr(a.n,a.d)} = ${T} minuten, dus ${fr(1,a.d)} = ${T} : ${a.n} = ${m} minuten.<br>Helemaal (${fr(a.d,a.d)}) = ${a.d} × ${m} = <b>${ans}</b> minuten`};
  }
  let a,b;do{a=proper(Math.min(d+1,4));b=proper(Math.min(d+1,4))}while(a.d===b.d||a.n*b.d===b.n*a.d||lcm(a.d,b.d)>40);
  const L=lcm(a.d,b.d),x=a.n*L/a.d,y=b.n*L/b.d,first=x>y,res=red(Math.abs(x-y),L);
  return{tag:'Verhaalsom',story:`Sem heeft ${fr(a.n,a.d)} van ${w.track} gehaald. Noor heeft ${fr(b.n,b.d)} gehaald. Hoeveel deel van ${w.track} heeft ${first?'Sem':'Noor'} meer gehaald?`,big:'',input:'frac',ans:res,bars:[[a.n,a.d],[b.n,b.d]],
    explain:`Maak de noemers gelijk (${L}): Sem ${fr(x,L)}, Noor ${fr(y,L)}<br>Verschil: ${fr(Math.max(x,y),L)} − ${fr(Math.min(x,y),L)} = ${fr(Math.abs(x-y),L)}${res.d!==L?` = ${fr(res.n,res.d)}`:''}`};
}
function makeQ2(wi,li){
  const d=wi+1,w=WORLDS2[wi];
  if(li===4){const q=makeQ2(wi,pick([0,1,2,2,3]));q.tag='Baas · '+q.tag;return q}
  if(li===0)return pick([()=>qSimplify(Math.min(d+1,4),12),q2Order,q2Order,q2CompareMixed,q2Improper])(d);
  if(li===1)return q2AddSub(d);
  if(li===2)return q2MulDiv(d);
  return q2Story(d,w);
}

async function initCloud(){

function toggleHint(){const b=document.getElementById('hintbox');if(b&&document.getElementById('hint'))b.hidden=!b.hidden}
let typed='';

const num=id=>{const el=document.getElementById(id);if(!el)return null;const v=el.value.trim();return v===''?null:Number(v)};
function check(){
  if(S.done)return;
  const q=S.q;let ok=false,note='';
  if(q.input==='choice'){ok=S.sel===q.ans}
  else if(q.input==='int'){const v=num('a-int');if(v===null)return say('bad','Vul eerst een antwoord in.');ok=v===q.ans}
  else{
    const wv=num('a-w')||0,t=num('a-t'),n=num('a-n');
    let N,D;
    if(t===null&&n===null){if(!wv)return say('bad','Vul eerst een antwoord in.');N=wv;D=1}
    else{if(t===null||n===null)return say('bad','Vul zowel de teller als de noemer in.');
      if(n===0)return say('bad','De noemer mag geen 0 zijn.');N=wv*n+t;D=n}
    ok=N*q.ans.d===q.ans.n*D;
    if(ok&&q.needMixed&&(t!==null&&t>=n)){ok=false;note='Klopt, maar schrijf het als gemengd getal: eerst de hele, dan de breuk.'}
    else if(ok&&D>1&&t!==null&&gcd(t,n)>1){
      if(q.simplest){ok=false;note='Klopt, maar het kan nog eenvoudiger!'}
      else note=`Goed! Nog korter: ${mix(q.ans.n,q.ans.d)}`;
    }
  }
  if(ok){S.done=true;S.res[S.i]=true;finish('good',pick(['Top! Greep gepakt.','Sterk geklommen!','Yes, raak!','Perfect!','Lekker bezig!']),note);}
  else{
    S.tries++;S.mistakes++;
    if(S.tries<2){
      if(q.input==='choice'){S.done=true;S.res[S.i]=false;finish('bad','Helaas, dat is hem niet.','',true);return}
      say('bad',note||'Nog niet goed. Probeer het nog een keer!',q.bars?'Tip: kijk eens naar de blokjes-hulp.':'');
    }else{S.done=true;S.res[S.i]=false;finish('bad','Gevallen! Zo had het gemoeten:','',true)}
  }
}
function say(kind,title,extra){

function next(){
  S.i++;

function result(){
  stopTimer();

  let st=good===QN&&S.mistakes===0?3:good>=QN-2?2:good>=QN/2?1:0;
  if(S.timeout)st=Math.min(st,good>=QN-2?1:0);
  const key=K(game,S.wi,S.li);
  if(st>(stars[key]||0))stars[key]=st;
  if(good>(best[key]||0))best[key]=good;
  save();
  const justUnlocked=game===1&&!wasUnlocked&&unlocked();
  const msg=S.timeout?'De tijd is op! De baas was je te snel af.':st===3?'Flash! Alles in één keer goed.':st===2?'Top gehaald! Bijna perfect.':st===1?'Top gehaald, met wat glijpartijen.':'Dit keer niet boven. Nog een poging?';
  const g=G(),L=g.levels.length,W=g.worlds.length;
  const nextLbl=S.li<L-1?'Volgende route →':S.wi<W-1?'Volgende wereld →':'';
  app.innerHTML=`

    <span class="tag">${g.worlds[S.wi].name} · ${g.levels[S.li].boss?'Baasroute':'Route '+(S.li+1)}</span>
    <h2>${msg}</h2>
    ${starHTML(st)}
    <p>${good} van de ${QN} grepen goed${S.mistakes?`, ${S.mistakes} keer misgegrepen`:''}${S.boss&&!S.timeout?`, ${fmt(S.timeLeft)} over op de klok`:''}.</p>
    <div style="width:min(100%,520px)">${meterHTML(S.wi,g.levels.map((_,li)=>best[K(game,S.wi,li)]||0),{})}</div>
    ${justUnlocked?'<p style="font-size:20px"><b>🎉 Alle routes op 3 sterren! Breukenklimmer 2 is vrijgespeeld.</b></p>':''}
    <div class="actions"><button class="btn" id="again">Opnieuw</button>
      ${justUnlocked?'<button class="btn main" id="go2">Naar Breukenklimmer 2 →</button>':nextLbl?`<button class="btn main" id="nxt">${nextLbl}</button>`:''}</div>
  </section>`;
  document.getElementById('back').onclick=home;
  const wi=S.wi,li=S.li;
  document.getElementById('again').onclick=()=>start(wi,li);
  const n=document.getElementById('nxt');
  if(n)n.onclick=()=>li<L-1?start(wi,li+1):start(wi+1,0);
  const g2=document.getElementById('go2');
  if(g2)g2.onclick=()=>{setGame(2);home();window.scrollTo(0,0)};
  (g2||n||document.getElementById('again')).focus({preventScroll:true});
}
/* ---- voortgang bewaren / herstellen ---- */
const IO_APP='BK',IO_NAME='Breukenklimmer',IO_NAMES={BK:'Breukenklimmer',TS:'Tafelsprint'};
function ioEncode(){const j=JSON.stringify(Object.assign({app:IO_APP,v:1,t:Date.now()},getState()));return IO_APP+'1:'+btoa(unescape(encodeURIComponent(j)))}
function ioDecode(s){
  s=(s||'').replace(/\s/g,'');
  const m=s.match(/^([A-Z]{2})1:([A-Za-z0-9+/=]+)$/);
  if(!m)throw new Error('Dit is geen geldige voortgangscode. Kopieer de hele code, inclusief het begin.');
  if(m[1]!==IO_APP)throw new Error(`Deze code hoort bij ${IO_NAMES[m[1]]||'een ander spel'}, niet bij ${IO_NAME}.`);
  let d;try{d=JSON.parse(decodeURIComponent(escape(atob(m[2]))))}catch(e){throw new Error('De code is niet compleet of beschadigd. Kopieer hem opnieuw.')}
  if(!d||d.app!==IO_APP)throw new Error('De code is niet compleet of beschadigd.');
  return d;
}
let ioOpener=null,ioChanged=false;
function ioShow(){
  let back=document.getElementById('io');
  if(!back){
    back=document.createElement('div');back.className='io-back';back.id='io';
    back.innerHTML=`<div class="io" role="dialog" aria-modal="true" aria-labelledby="io-t">
      <h2 id="io-t">Voortgang bewaren of herstellen</h2>
      <section><h3>Bewaren</h3><p class="muted">Kopieer deze code en bewaar hem, bijvoorbeeld in Notities of in een mail aan jezelf.</p>
        <textarea id="io-out" readonly rows="3" aria-label="Voortgangscode"></textarea>
        <div class="io-row"><button class="btn main" id="io-copy">Kopieer code</button><button class="btn" id="io-file">Bewaar als bestand</button></div>
        <p class="io-msg" id="io-m1" role="status"></p></section>
      <section><h3>Herstellen</h3><p class="muted">Plak een bewaarde code of kies een bewaard bestand. De voortgang wordt samengevoegd met wat er al staat, dus je raakt niets kwijt.</p>
        <textarea id="io-in" rows="3" placeholder="Plak hier je code" aria-label="Code om te herstellen"></textarea>
        <div class="io-row"><button class="btn main" id="io-load">Herstel voortgang</button><button class="btn" id="io-pickb">Kies bestand</button><input type="file" id="io-pick" accept=".txt,text/plain" hidden></div>
        <p class="io-msg" id="io-m2" role="status"></p></section>
      <div class="io-row end"><button class="btn" id="io-close">Sluiten <kbd>Esc</kbd></button></div></div>`;
    document.body.appendChild(back);
    const $=id=>document.getElementById(id);
    const msg=(id,t,ok)=>{const m=$(id);m.textContent=t;m.className='io-msg '+(ok?'ok':'err')};
    $('io-copy').onclick=async()=>{const t=$('io-out');try{await navigator.clipboard.writeText(t.value);msg('io-m1','Gekopieerd! Plak hem ergens waar je hem terugvindt.',true)}catch(e){t.focus();t.select();msg('io-m1','Kopi\u00ebren lukte niet automatisch. De code is geselecteerd: kopieer hem zelf.',false)}};
    $('io-file').onclick=()=>{try{const d=new Date(),ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('io-out').value],{type:'text/plain'}));a.download=`${IO_NAME}-voortgang-${ds}.txt`;document.body.appendChild(a);a.click();a.remove();
      msg('io-m1','Bestand bewaard (kijk in Downloads of de Bestanden-app).',true)}catch(e){msg('io-m1','Bewaren als bestand lukte niet. Gebruik Kopieer code.',false)}};
    const doImport=txt=>{try{const d=ioDecode(txt);mergeIn(d);saveLocal();pushCloud();ioChanged=true;$('io-out').value=ioEncode();msg('io-m2','Hersteld! Je voortgang is bijgewerkt.',true)}catch(e){msg('io-m2',e.message||'Herstellen lukte niet.',false)}};
    $('io-load').onclick=()=>{if(!$('io-in').value.trim())return msg('io-m2','Plak eerst een code.',false);doImport($('io-in').value)};
    $('io-pickb').onclick=()=>$('io-pick').click();
    $('io-pick').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('io-in').value=String(r.result).trim();doImport(r.result)};r.readAsText(f);e.target.value=''};
    $('io-close').onclick=ioHide;
    back.addEventListener('click',e=>{if(e.target===back)ioHide()});
    back.addEventListener('keydown',e=>{
      e.stopPropagation();
      if(e.key==='Escape'){e.preventDefault();ioHide();return}
      if(e.key==='Tab'){const f=[...back.querySelectorAll('button,textarea')].filter(x=>!x.disabled);const first=f[0],last=f[f.length-1];
        if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}
    });
  }
  ioOpener=document.activeElement;ioChanged=false;
  document.getElementById('io-out').value=ioEncode();
  document.getElementById('io-in').value='';
  document.getElementById('io-m1').textContent='';document.getElementById('io-m2').textContent='';
  back.hidden=false;
  document.getElementById('io-copy').focus({preventScroll:true});
}
function ioHide(){
  const back=document.getElementById('io');if(!back)return;back.hidden=true;
  if(ioChanged&&!S){home();const b=document.getElementById('io-open');if(b)b.focus({preventScroll:true})}
  else if(ioOpener&&document.contains(ioOpener))ioOpener.focus({preventScroll:true});
}
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('#io-open'))ioShow()});
setGame(1);
home();
})();
</script>
