<!doctype html>
<html lang="nl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Telfeest</title>
<meta name="description" content="Tellen en getallen voor kleuters, zonder lezen.">
<meta name="theme-color" content="#f07ab8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tellen">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Bungee&display=swap">
<style>
/* Layout: start = grote thema-tegels (alleen plaatjes) + stickerboek; spelen = 5 sterren, plaatje/scène, grote antwoordknoppen onderin */
:root{
  --bg:#fbf3ff; --panel:#ffffff; --ink:#2a2036; --muted:#6d6180; --line:#e6d7f2; --soft:#f6ecfd;
  --good:#2fa65a; --bad:#e0573f; --acc:#b84fd6;
  --display:"Bungee","Arial Black",Impact,sans-serif;
  --body:"Andika",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1d1724; --panel:#2a2233; --ink:#f6f0fb; --muted:#b5a8c6; --line:#43375a; --soft:#352b42;
  --good:#5bcf80; --bad:#f17a62; --acc:#d58af0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1d1724; --panel:#2a2233; --ink:#f6f0fb; --muted:#b5a8c6; --line:#43375a; --soft:#352b42;
  --good:#5bcf80; --bad:#f17a62; --acc:#d58af0; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:19px;line-height:1.4;-webkit-user-select:none;user-select:none}
.wrap{max-width:1100px;margin:0 auto;padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1{margin:0;font:400 clamp(30px,7vw,46px)/1.05 var(--display);background:linear-gradient(90deg,#e94b6a,#f39a2b,#e9c629,#46b768,#3c8fe0,#9b5de5);-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:0}
.muted{color:var(--muted)}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;color:var(--ink)}
button:focus-visible{outline:4px solid var(--acc);outline-offset:3px}
.small{font-size:15px}

/* home */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.theme{aspect-ratio:1;border-radius:24px;border:4px solid #fff8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:72px;box-shadow:0 6px 0 #0002;transition:transform .15s}
.theme:active{transform:scale(.95) translateY(4px);box-shadow:0 2px 0 #0002}
.theme span{font:700 15px var(--body);color:#2a2036;background:#fffc;border-radius:999px;padding:1px 10px}
.book{background:var(--panel);border:3px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px}
.stickers{display:flex;flex-wrap:wrap;gap:6px;font-size:36px;min-height:44px}
.stickers .empty{font-size:15px;color:var(--muted);align-self:center}
.parent{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:15px;color:var(--muted)}
.parent button{border:2px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 10px;font-size:15px}
.parent button[aria-pressed="true"]{border-color:var(--acc);background:var(--soft)}

/* play */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.iconbtn{width:64px;height:64px;border-radius:50%;border:3px solid var(--line);background:var(--panel);font-size:30px;display:grid;place-items:center;flex:none}
.progress{display:flex;gap:8px;font-size:34px}
.progress .off{opacity:.25;filter:grayscale(1)}
.scene{position:relative;background:var(--panel);border:4px solid var(--line);border-radius:28px;min-height:min(420px,48vh);padding:18px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:12px;overflow:hidden}
.objs{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:8px;max-width:820px}
.obj{position:relative;line-height:1;border:0;background:none;padding:2px;transition:transform .2s,opacity .5s}
.obj.counted{transform:scale(1.12)}
.obj .badge{position:absolute;top:-6px;right:-6px;font:700 18px/1 var(--body);background:var(--acc);color:#fff;border-radius:999px;padding:3px 7px}
.obj.new{animation:flyin .7s ease-out both}
.obj.away{animation:flyaway 1s ease-in forwards}
@keyframes flyin{from{transform:translateY(-140px) scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes flyaway{to{transform:translate(160px,-200px) rotate(30deg) scale(.4);opacity:0}}
.glow{animation:glow 1s ease-in-out}
@keyframes glow{50%{transform:scale(1.25)}}
.cards{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
.card{min-width:110px;height:130px;border-radius:20px;background:var(--soft);border:4px solid var(--line);display:grid;place-items:center;font:700 72px var(--body)}
.card.q{border-style:dashed;border-color:var(--acc);color:var(--acc)}
.dice{display:flex;gap:24px}
.die{width:150px;height:150px;border-radius:26px;background:#fff;border:4px solid #d9cbe6;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:16px;box-sizing:border-box}
.die i{width:28px;height:28px;border-radius:50%;background:#3a2b4f;place-self:center;visibility:hidden}
.die i.on{visibility:visible}
.cloud{font-size:120px;line-height:1}
.nests{display:flex;gap:28px;align-items:stretch;flex-wrap:wrap;justify-content:center}
.nest{min-width:220px;min-height:180px;border-radius:30px;background:var(--soft);border:4px solid var(--line);display:flex;align-items:center;justify-content:center;padding:10px}
.answers{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.ans{min-width:150px;min-height:130px;border-radius:26px;border:4px solid var(--line);background:var(--panel);font:700 70px var(--body);box-shadow:0 6px 0 var(--line);transition:transform .1s}
.ans:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.ans.group{font-size:inherit;padding:12px;display:flex;flex-wrap:wrap;gap:4px;align-content:center;justify-content:center;max-width:380px}
.ans.wrong{animation:shake .4s;opacity:.35;pointer-events:none}
.ans.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--panel));box-shadow:0 6px 0 var(--good)}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.burst{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.burst span{position:absolute;bottom:-60px;font-size:46px;animation:up 1.6s ease-out forwards}
@keyframes up{to{transform:translateY(-110vh) rotate(var(--r));opacity:.2}}

/* reward */
.reward{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding-top:20px}
.bigsticker{font-size:150px;line-height:1;animation:pop 1s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
.stars{font-size:46px}
.row{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap" id="app"></div>

<script>
(function(){
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};

/* ============ thema's ============ */
const THEMES=[
 {id:'eenhoorn',e:'🦄',bg:'#ffd6f0',label:'Eenhoorns',noun:['eenhoorn','eenhoorns'],intro:'Eenhoorns! Daar gaan we.',st:['🦄','🌈','⭐','💖','✨']},
 {id:'regenboog',e:'🌈',bg:'#d6ecff',label:'Regenbogen',noun:['regenboog','regenbogen'],intro:'Regenbogen in alle kleuren!',st:['🌈','☀️','☁️','💧','🎨']},
 {id:'frozen',e:'❄️',bg:'#d8f3ff',label:'Frozen',noun:['sneeuwvlok','sneeuwvlokken'],intro:'Elsa tovert sneeuwvlokken. Help je Anna tellen?',st:['❄️','⛄','👑','💎','🏰']},
 {id:'paw',e:'🐶',bg:'#ffe7c7',label:'Paw Patrol',noun:['puppy','puppy\'s'],intro:'De puppy\'s van Paw Patrol staan klaar!',st:['🐶','🐾','🦴','🚒','⭐']},
 {id:'minion',e:'🍌',bg:'#fff3a8',label:'Minions',noun:['banaan','bananen'],intro:'De minions hebben honger. Banaanaaa!',st:['🍌','👓','🎈','🍦','💛']},
 {id:'minecraft',e:'💎',bg:'#d7f5dc',label:'Minecraft',noun:['diamant','diamanten'],intro:'Hak diamanten, net als in Minecraft!',st:['💎','⛏️','🧱','🌳','🐷']},
 {id:'barbie',e:'👗',bg:'#ffd3e6',label:'Barbie',noun:['jurkje','jurkjes'],intro:'Glitterjurkjes voor Barbie!',st:['👗','👠','💄','👛','✨']},
 {id:'lego',e:'🧱',bg:'#ffe0d6',label:'LEGO Friends',noun:['blokje','blokjes'],intro:'Bouw mee met LEGO Friends!',st:['🧱','🏠','🎡','🐴','🌸']},
 {id:'pika',e:'⚡',bg:'#fff1b8',label:'Pikachu',noun:['bliksem','bliksems'],intro:'Pikachu geeft schokjes! Pika pika!',st:['⚡','🔴','⭐','🍓','💛']},
 {id:'scheet',e:'💨',bg:'#e6f7d4',label:'Scheetjes',noun:['scheetje','scheetjes'],intro:'Oei! Wie heeft er een scheetje gelaten?',st:['💨','🤭','😂','🍑','🌬️'],farts:true}
];
const LEVELS=[null,
 {name:'tot 6',cnt:6,flits:[1,6],num:6,sum:6,split:0,seq:10},
 {name:'tot 10',cnt:10,flits:[1,6],num:10,sum:10,split:5,seq:15},
 {name:'tot 12',cnt:12,flits:[2,12],num:10,sum:10,split:10,seq:20},
 {name:'tot 20',cnt:20,flits:[2,12],num:20,sum:12,split:10,seq:20}];

/* ============ getallen als woorden ============ */
const NUM=['nul','één','twee','drie','vier','vijf','zes','zeven','acht','negen','tien','elf','twaalf','dertien','veertien','vijftien','zestien','zeventien','achttien','negentien','twintig'];
const w=n=>NUM[n]||String(n);
const nn=(t,n)=>n===1?t.noun[0]:t.noun[1];

/* ============ geluid ============ */
let AC=null;
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function tone(f,t0,d,type='sine',vol=.18){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,a.currentTime+t0);g.gain.linearRampToValueAtTime(vol,a.currentTime+t0+.02);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t0+d);o.connect(g).connect(a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+d+.05)}
const chime=()=>{tone(784,0,.18);tone(1047,.12,.3)};
const boop=()=>tone(220,0,.25,'triangle',.15);
function fart(){
  const a=ac();if(!a)return;const t=a.currentTime,dur=R(55,95)/100;
  const o=a.createOscillator(),g=a.createGain(),lp=a.createBiquadFilter(),lfo=a.createOscillator(),lg=a.createGain();
  o.type='sawtooth';o.frequency.setValueAtTime(R(85,120),t);o.frequency.exponentialRampToValueAtTime(R(45,65),t+dur);
  lfo.frequency.value=R(18,32);lg.gain.value=.12;lfo.connect(lg).connect(g.gain);
  lp.type='lowpass';lp.frequency.value=650;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.32,t+.04);g.gain.setValueAtTime(.3,t+dur*.7);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(lp).connect(g).connect(a.destination);o.start(t);lfo.start(t);o.stop(t+dur+.05);lfo.stop(t+dur+.05);
}

/* ============ stem ============ */
let VOICES=[];
function loadVoices(){try{VOICES=speechSynthesis.getVoices().filter(v=>/^nl/i.test(v.lang)).sort((a,b)=>score(b)-score(a))}catch(e){}}
function score(v){let s=/^nl[-_]NL/i.test(v.lang)?2:1;if(/premium|enhanced|verbeterd/i.test(v.name+v.voiceURI))s+=4;if(/eddy|flo\b|grandma|grandpa|reed|rocko|sandy|shelley/i.test(v.name))s-=4;return s}
try{loadVoices();speechSynthesis.addEventListener('voiceschanged',loadVoices)}catch(e){}
function say(text,queue){
  try{if(!queue)speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const v=VOICES[0];u.lang=v?v.lang:'nl-NL';if(v)u.voice=v;u.rate=.9;u.pitch=1.1;speechSynthesis.speak(u)}catch(e){}
}

/* ============ opslag ============ */
const load=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}};
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let st=load('tf-state',{level:2,hist:[],stickers:[]});
if(!(st.level>=1&&st.level<=4))st.level=2;st.hist=st.hist||[];st.stickers=st.stickers||[];
const save=()=>store('tf-state',st);

/* ============ vragen ============ */
function opts3(ans,lo,hi){
  const set=new Set([ans]);let tries=0;
  while(set.size<3&&tries++<50){const d=pick([-2,-1,1,2,1,-1]);const v=ans+d;if(v>=lo&&v<=hi)set.add(v)}
  for(let v=lo;set.size<3&&v<=hi;v++)set.add(v);
  return shuffle([...set]);
}
function objSize(n){return n<=6?78:n<=10?64:n<=14?54:44}
function objsHTML(t,n,cls='',start=0){return Array.from({length:n},(_,i)=>`<button class="obj ${cls}" data-i="${start+i}" style="font-size:${objSize(n)}px" aria-label="${t.noun[0]}">${t.e}</button>`).join('')}

const GAMES={
  tel(t,L){
    const n=R(Math.min(3,L.cnt),L.cnt);
    return{ans:n,opts:opts3(n,1,L.cnt+2),speak:`Hoeveel ${t.noun[1]} zijn het? Tik ze maar aan om te tellen.`,
      scene:`<div class="objs" id="objs">${objsHTML(t,n)}</div>`,countable:true,
      hint:()=>countAll()};
  },
  flits(t,L){
    const n=R(L.flits[0],L.flits[1]),two=n>6||(L.flits[1]>6&&Math.random()<.4&&n>=2);
    let a=n,b=0;if(two){a=Math.min(6,R(Math.max(1,n-6),n-1));b=n-a}
    return{ans:n,opts:opts3(n,1,Math.max(6,L.flits[1])),speak:two?'Kijk goed! Hoeveel stippen zijn het samen?':'Kijk goed! Hoeveel stippen zie je?',
      scene:`<div id="flits">${diceHTML(a,b)}</div>`,flash:{a,b},
      hint:()=>showDice(a,b,2600)};
  },
  cijfer(t,L){
    const n=R(0,L.num),o=new Set([n]);while(o.size<(L.num>10?4:3))o.add(R(0,L.num));
    return{ans:n,opts:shuffle([...o]),speak:`Waar staat ${w(n)}?`,
      scene:`<div class="cloud" aria-hidden="true">👂</div>`,hint:()=>say(`Zoek ${w(n)}.`)};
  },
  meer(t,L){
    const most=Math.random()<.5,eq=Math.random()<.18;
    let a=R(1,Math.min(L.cnt,10)),b=eq?a:R(1,Math.min(L.cnt,10));while(!eq&&b===a)b=R(1,Math.min(L.cnt,10));
    const ans=eq?'=':(most?(a>b?'L':'R'):(a<b?'L':'R'));
    return{ans,groups:[a,b],speak:most?`Waar zijn de meeste ${t.noun[1]}? Of zijn het er evenveel?`:`Waar zijn de minste ${t.noun[1]}? Of zijn het er evenveel?`,
      scene:`<div class="cloud" aria-hidden="true">${t.e}🤔</div>`,hint:()=>say(`Tel ze allebei maar. Links ${w(a)}, rechts ${w(b)}.`)};
  },
  erna(t,L){
    const k=pick(['na','voor','tussen']);const n=R(k==='voor'?1:0,L.seq-(k==='na'?1:0));
    let cards,ans,txt;
    if(k==='na'){const s=Math.max(0,n-1);cards=[s,s+1,'?'];ans=s+2;txt=`Welk getal komt na ${w(s+1)}?`}
    else if(k==='voor'){const s=Math.max(1,n);cards=['?',s,s+1];ans=s-1;txt=`Welk getal komt voor ${w(s)}?`}
    else{const s=Math.max(0,Math.min(n,L.seq-2));cards=[s,'?',s+2];ans=s+1;txt=`Welk getal hoort tussen ${w(s)} en ${w(s+2)}?`}
    if(ans>L.seq||ans<0)return GAMES.erna(t,L);
    return{ans,opts:opts3(ans,0,L.seq),speak:txt,
      scene:`<div class="cards">${cards.map(c=>`<div class="card${c==='?'?' q':''}">${c}</div>`).join('')}</div>`,
      hint:()=>say('Tel maar hardop mee: '+[...Array(ans+1).keys()].slice(Math.max(0,ans-3)).map(w).join(', ')+'.')};
  },
  erbij(t,L){
    const plus=Math.random()<.55;let a,b;
    if(plus){a=R(1,L.sum-1);b=R(1,Math.min(5,L.sum-a))}else{a=R(2,L.sum);b=R(1,Math.min(5,a-1))}
    const ans=plus?a+b:a-b;
    const story=plus?`Er ${a===1?'is':'zijn'} ${w(a)} ${nn(t,a)}. Er ${b===1?'komt':'komen'} er ${w(b)} bij. Hoeveel ${t.noun[1]} zijn het nu?`
                    :`Er ${a===1?'is':'zijn'} ${w(a)} ${nn(t,a)}. Er ${b===1?'gaat':'gaan'} er ${w(b)} weg. Hoeveel ${t.noun[1]} zijn er nog?`;
    return{ans,opts:opts3(ans,0,L.sum+2),speak:story,anim:{plus,a,b},
      scene:`<div class="objs" id="objs">${objsHTML(t,a)}</div>`,countable:true,
      hint:()=>countAll()};
  },
  splits(t,L){
    const n=R(3,L.split),k=R(1,n-1),ans=n-k;
    return{ans,opts:opts3(ans,0,n),speak:`Er zijn ${w(n)} ${t.noun[1]}. In dit mandje ${k===1?'zit':'zitten'} er ${w(k)}. Hoeveel zitten er onder de wolk?`,
      scene:`<div class="nests"><div class="nest"><div class="objs">${objsHTML(t,k)}</div></div><div class="nest" id="hid"><span class="cloud">☁️</span></div></div>`,
      hint:()=>{const h=document.getElementById('hid');if(h){h.innerHTML=`<div class="objs">${objsHTML(t,ans,'new')}</div>`;say('Kijk, tel ze maar!');setTimeout(()=>{if(h.isConnected)h.innerHTML='<span class="cloud">☁️</span>'},2200)}}};
  }
};
function diceHTML(a,b){return `<div class="dice">${die(a)}${b?die(b):''}</div>`}
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const die=n=>`<div class="die" aria-label="${n}">${Array.from({length:9},(_,i)=>`<i class="${PIPS[n].includes(i)?'on':''}"></i>`).join('')}</div>`;
function showDice(a,b,ms){const f=document.getElementById('flits');if(!f)return;f.innerHTML=diceHTML(a,b);clearTimeout(S&&S.flashT);S.flashT=setTimeout(()=>{if(f.isConnected)f.innerHTML='<div class="cloud">🙈</div><button class="iconbtn" id="peek" aria-label="Nog een keer kijken" style="margin:auto">👀</button>';const p=document.getElementById('peek');if(p)p.onclick=()=>showDice(a,b,1600)},ms)}

function typesFor(level){return level===1?['tel','flits','cijfer','meer','erna','erbij']:['tel','flits','cijfer','meer','erna','erbij','splits']}

/* ============ schermen ============ */
const app=document.getElementById('app');
let S=null;
function home(){
  S=null;try{speechSynthesis.cancel()}catch(e){}
  const L=LEVELS[st.level];
  app.innerHTML=`
  <header style="display:flex;flex-direction:column;gap:6px">
    <h1>Telfeest</h1>
  </header>
  <section class="themes">${THEMES.map((t,i)=>`<button class="theme" data-t="${i}" style="background:${t.bg}" aria-label="${t.label}">${t.e}<span>${t.label}</span></button>`).join('')}</section>
  <section class="book"><div class="small muted">Stickerboek · ${st.stickers.length}</div>
    <div class="stickers">${st.stickers.length?st.stickers.slice(-40).map(s=>`<span>${s}</span>`).join(''):'<span class="empty">Speel een rondje en verdien je eerste sticker!</span>'}</div></section>
  <section class="parent"><span>Voor ouders · niveau:</span>${[1,2,3,4].map(n=>`<button data-lv="${n}" aria-pressed="${st.level===n}">${LEVELS[n].name}</button>`).join('')}<span>(gaat vanzelf omhoog of omlaag)</span></section>`;
  app.querySelectorAll('.theme').forEach(b=>b.onclick=()=>{ac();start(+b.dataset.t)});
  app.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{st.level=+b.dataset.lv;st.hist=[];save();home()});
}
function start(ti){
  const t=THEMES[ti],types=shuffle(typesFor(st.level).slice()).slice(0,5);
  S={ti,t,types,i:0,good:0,tries:0};
  say(t.intro);
  ask(true);
}
function ask(queue){
  const t=S.t,L=LEVELS[st.level];
  const q=GAMES[S.types[S.i]](t,L);S.q=q;S.tries=0;S.locked=false;
  app.innerHTML=`
  <div class="top"><button class="iconbtn" id="homeb" aria-label="Terug">🏠</button>
    <div class="progress" aria-label="Vraag ${S.i+1} van 5">${Array.from({length:5},(_,i)=>`<span class="${i<S.i?'':'off'}">⭐</span>`).join('')}</div>
    <button class="iconbtn" id="spk" aria-label="Nog een keer horen">🔊</button></div>
  <div class="scene" id="scene" style="background:color-mix(in srgb,${t.bg} 45%,var(--panel))">${q.scene}</div>
  <div class="answers" id="answers">${q.groups?
      `<button class="ans group" data-a="L" style="font-size:${objSize(q.groups[0])*.8}px">${t.e.repeat(q.groups[0])}</button><button class="ans" data-a="=" aria-label="Evenveel">=</button><button class="ans group" data-a="R" style="font-size:${objSize(q.groups[1])*.8}px">${t.e.repeat(q.groups[1])}</button>`
     :q.opts.map(v=>`<button class="ans" data-a="${v}">${v}</button>`).join('')}</div>`;
  document.getElementById('homeb').onclick=home;
  document.getElementById('spk').onclick=()=>say(q.speak);
  document.getElementById('answers').onclick=e=>{const b=e.target.closest('.ans');if(b)answer(b)};
  if(q.countable)setupCount();
  if(q.flash)showDice(q.flash.a,q.flash.b,2200);
  if(q.anim)runAnim(q.anim);
  say(q.speak,queue);
}
function setupCount(){
  S.counted=0;
  document.getElementById('objs').onclick=e=>{
    const o=e.target.closest('.obj');if(!o||o.classList.contains('counted')||o.classList.contains('away'))return;
    S.counted++;o.classList.add('counted');o.insertAdjacentHTML('beforeend',`<span class="badge">${S.counted}</span>`);say(w(S.counted));tone(500+S.counted*30,0,.12,'sine',.08);
  };
}
function countAll(){
  const os=[...document.querySelectorAll('#objs .obj:not(.away)')];
  os.forEach(o=>{o.classList.remove('counted');const b=o.querySelector('.badge');if(b)b.remove()});S.counted=0;
  os.forEach((o,i)=>setTimeout(()=>{if(!o.isConnected)return;S.counted=i+1;o.classList.add('counted');o.insertAdjacentHTML('beforeend',`<span class="badge">${i+1}</span>`);say(w(i+1))},i*700));
}
function runAnim(an){
  const box=document.getElementById('objs');S.locked=true;
  setTimeout(()=>{
    if(!box.isConnected)return;
    if(an.plus){box.insertAdjacentHTML('beforeend',objsHTML(S.t,an.b,'new',an.a));const n=an.a+an.b;box.querySelectorAll('.obj').forEach(o=>o.style.fontSize=objSize(n)+'px')}
    else{const os=[...box.querySelectorAll('.obj')].slice(-an.b);os.forEach(o=>o.classList.add('away'));setTimeout(()=>os.forEach(o=>o.remove()),1000)}
    S.locked=false;
  },1800);
}
function burst(emojis){
  const d=document.createElement('div');d.className='burst';
  d.innerHTML=Array.from({length:14},()=>`<span style="left:${R(2,92)}%;--r:${R(-60,60)}deg;animation-delay:${R(0,40)/100}s">${pick(emojis)}</span>`).join('');
  document.body.appendChild(d);setTimeout(()=>d.remove(),2200);
}
function answer(b){
  if(S.locked||b.classList.contains('wrong'))return;
  const q=S.q,val=b.dataset.a,ok=String(q.ans)===val;
  if(ok){
    S.locked=true;if(S.tries===0){S.good++;st.hist.push(1)}else st.hist.push(0);
    b.classList.add('right');chime();if(S.t.farts||Math.random()<.12)setTimeout(fart,250);
    burst([S.t.e,'⭐','✨','💖']);
    say(pick(['Goed zo!','Super!','Knap hoor!','Hoera!','Wat goed!','Jaaa!']));
    setTimeout(next,1700);
  }else{
    S.tries++;b.classList.add('wrong');boop();
    if(S.tries===1){say(pick(['Bijna! Probeer het nog een keer.','Oeps! Nog een keer proberen?']));setTimeout(()=>q.hint&&q.hint(),900)}
    else{
      S.locked=true;st.hist.push(0);
      const r=[...document.querySelectorAll('.ans')].find(x=>x.dataset.a===String(q.ans));
      if(r)r.classList.add('right','glow');
      say(q.ans==='='?'Ze zijn evenveel!':q.ans==='L'||q.ans==='R'?'Kijk, deze was het!':`Het is ${w(q.ans)}!`);
      setTimeout(next,2400);
    }
  }
}
function next(){
  S.i++;
  if(S.i<5)return ask(false);
  reward();
}
function adapt(){
  st.hist=st.hist.slice(-12);let msg='';
  if(st.hist.length>=10){
    const ok=st.hist.slice(-10).reduce((a,b)=>a+b,0);
    if(ok>=8&&st.level<4){st.level++;st.hist=[];msg='Jij wordt steeds slimmer! Het wordt nu een beetje moeilijker.'}
    else if(ok<=3&&st.level>1){st.level--;st.hist=[];msg=''}
  }
  return msg;
}
function reward(){
  const t=S.t,sticker=pick(t.st);st.stickers.push(sticker);const msg=adapt();save();
  const stars=S.good;
  app.innerHTML=`
  <section class="reward">
    <div class="stars" aria-label="${stars} van 5 sterren">${Array.from({length:5},(_,i)=>`<span class="${i<stars?'':'off'}" style="${i<stars?'':'opacity:.25;filter:grayscale(1)'}">⭐</span>`).join('')}</div>
    <div class="bigsticker" aria-label="Nieuwe sticker">${sticker}</div>
    <div class="row">
      <button class="iconbtn" id="again" aria-label="Nog een rondje" style="width:110px;height:110px;font-size:52px">🔁</button>
      <button class="iconbtn" id="homeb" aria-label="Naar het begin" style="width:110px;height:110px;font-size:52px">🏠</button>
    </div>
  </section>`;
  burst([sticker,'✨','💨','⭐']);fart();setTimeout(fart,700);
  say(`Wauw! Je hebt een nieuwe sticker verdiend!`);if(msg)say(msg,true);
  const ti=S.ti;
  document.getElementById('again').onclick=()=>start(ti);
  document.getElementById('homeb').onclick=home;
}
home();
window.__test={GAMES,LEVELS,THEMES,typesFor};
})();
</script>

</body></html>
